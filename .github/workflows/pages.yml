name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'master' ||
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Datos 5etools (PHB)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/5etools-mirror-3/5etools-src.git vendor/5etools-src
          cd vendor/5etools-src && git sparse-checkout set data
      - name: Traducción Foundry ES
        run: |
          git clone --depth 1 \
            https://github.com/foundryvtt-sinregistrar/translate-dnd5e-sdr2-es.git \
            vendor/translate-dnd5e-sdr2-es
      - run: npm run build:content-pack
      - run: npm run build:phb-i18n
      - run: npm run copy:content-pack
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.event.workflow_run.id }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.event.workflow_run.id }}
